name: code-coverage

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-coverage::${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-coverage:
    name: Rust Cobertura coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      - name: Install coverage tool
        # taiki-e/install-action v2
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d
        with:
          tool: cargo-llvm-cov

      - name: Generate Rust coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          cargo llvm-cov --workspace --all-targets \
            --cobertura --output-path coverage/rust.xml

      - name: Upload Rust coverage to GitHub Code Quality
        # actions/upload-code-coverage v1
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34
        with:
          file: coverage/rust.xml
          language: Rust
          label: code-coverage/rust
          # Keep the portable Cobertura artifact authoritative when the optional
          # repository Code Quality feature is unavailable.
          fail-on-error: false

      - name: Upload Cobertura report
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-cobertura-coverage
          path: coverage/rust.xml
          if-no-files-found: error

      - name: Summarize coverage report
        shell: bash
        run: |
          set -euo pipefail
          echo "### Rust coverage report" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from xml.etree import ElementTree

          root = ElementTree.parse("coverage/rust.xml").getroot()
          line_rate = float(root.attrib.get("line-rate", "0"))
          print(f"- `coverage/rust.xml`: {line_rate * 100:.2f}% line coverage")
          PY
