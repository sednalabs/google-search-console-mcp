name: dependency-governance

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/dependency-governance.yml"
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/dependency-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-governance::${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-governance:
    name: Rust dependency governance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      - name: Install governance tools
        # taiki-e/install-action v2
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d
        with:
          tool: cargo-deny,cargo-audit,cargo-outdated

      - name: Check advisories and sources
        shell: bash
        run: |
          set -euo pipefail
          cargo deny check advisories sources
          cargo audit --deny warnings

      - name: Report outdated dependencies
        continue-on-error: true
        shell: bash
        run: cargo outdated --workspace --exit-code 1
